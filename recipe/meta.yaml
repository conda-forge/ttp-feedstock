{% set name = "ttp" %}
{% set version = "0.10.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/ttp-{{ version }}.tar.gz
  sha256: 40f1ca61ee1431f5b1ab5326fb55f852a04749e9574792d45455b62c5e7ac97b

build:
  entry_points:
    - ttp = ttp.ttp:cli_tool
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.7,<4.0
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=3.7,<4.0

test:
  imports:
    - ttp
  commands:
    - pip check
    - ttp --help
  requires:
    - pip

about:
  home: https://github.com/dmulyalin/ttp
  summary: Template Text Parser
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cousinbr
